apiVersion: apps/v1
kind: Deployment

metadata:
  name: result
  namespace: voting-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: result

  template:
    metadata:
      labels:
        app: result

    spec:
      containers:
      - name: result

        image: result:latest

        imagePullPolicy: Never

        ports:
        - containerPort: 80