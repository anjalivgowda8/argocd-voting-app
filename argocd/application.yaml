apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: voting-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/anjalivgowda8/argocd-voting-app.git
    targetRevision: master
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: voting-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
